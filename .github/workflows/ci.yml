name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINT_VERSION: v2.12.2

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано (запустите task fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod в актуальном состоянии
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Собственный action используется вместо `task lint`: он кеширует
      # и бинарник линтера, и результаты анализа.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.LINT_VERSION }}

  test:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexi
          POSTGRES_PASSWORD: lexi
          POSTGRES_DB: lexi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://lexi:lexi@localhost:5432/lexi_test?sslmode=disable
      DATABASE_URL: postgres://lexi:lexi@localhost:5432/lexi_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Taskfile читает .env; в CI значения приходят из окружения job'а,
      # поэтому файл нужен пустой — иначе значения из него перекроют нужные.
      - name: Пустой .env для task
        run: touch .env

      - name: Юнит-тесты
        run: task test:cover

      - name: Интеграционные тесты
        run: task test:integration

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  vuln:
    name: Уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - run: go tool govulncheck ./...

  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - run: go build -trimpath -ldflags="-s -w" -o bin/lexi-bot ./cmd/bot
