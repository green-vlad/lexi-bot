other = "Выберите язык интерфейса."

[help.text]
other = "Вот что я умею:\n\n/start — начать заниматься\n/language — язык интерфейса\n/cancel — прервать диалог\n/help — эта справка\n\nОстальное (занятия, свои слова, статистика) появится в ближайших обновлениях."

[language.changed]
