# Переводы интерфейса на русский.
#
# Формат — go-i18n: у сообщения с числом перечисляются формы (one/few/many/
# other), у обычного достаточно other. Подстановки именованные: {{.Name}}
# читается в переводе лучше, чем %s, и не ломается при смене порядка слов.
#
# Набор ключей и подстановок обязан совпадать с en.toml — это проверяет тест.

[common.error]
other = "Что-то пошло не так. Попробуйте ещё раз через минуту."

