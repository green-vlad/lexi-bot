# Переводы интерфейса на русский.
#
# Формат — go-i18n: у сообщения с числом перечисляются формы (one/few/many/
# other), у обычного достаточно other. Подстановки именованные: {{.Name}}
# читается в переводе лучше, чем %s, и не ломается при смене порядка слов.
#
# Набор ключей и подстановок обязан совпадать с en.toml — это проверяет тест.

[common.error]
other = "Что-то пошло не так. Попробуйте ещё раз через минуту."

[common.cancelled]
other = "Отменил."

[common.unknown_command]
other = "Не знаю такой команды. Посмотрите /help."

[start.greeting]
other = "Привет, {{.Name}}! Я помогу выучить слова — по несколько новых в день и с повторением того, что уже проходили."

[start.choose_ui_lang]
other = "Выберите язык интерфейса."

[help.text]
other = "/learn — заниматься\n/add — добавить своё слово\n/decks — мои курсы\n/stats — статистика\n/settings — настройки"

[language.changed]
other = "Язык интерфейса переключён на русский."

[cards.due]
description = "Сколько карточек ждёт повторения"
one = "{{.Count}} карточка ждёт повторения"
few = "{{.Count}} карточки ждут повторения"
many = "{{.Count}} карточек ждут повторения"
other = "{{.Count}} карточки ждут повторения"

[cards.new_today]
description = "Сколько новых слов введено сегодня"
one = "Сегодня добавлено {{.Count}} новое слово"
few = "Сегодня добавлено {{.Count}} новых слова"
many = "Сегодня добавлено {{.Count}} новых слов"
other = "Сегодня добавлено {{.Count}} новых слова"

[session.finished]
other = "На сегодня всё. Следующее повторение — {{.NextAt}}."

[session.show_translation]
other = "Показать перевод"

[settings.new_per_day]
description = "Текущий дневной лимит новых слов"
one = "Сейчас {{.Count}} новое слово в день"
few = "Сейчас {{.Count}} новых слова в день"
many = "Сейчас {{.Count}} новых слов в день"
other = "Сейчас {{.Count}} новых слова в день"
