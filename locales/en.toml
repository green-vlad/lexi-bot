# Interface translations, English.
#
# Format is go-i18n: a message with a count lists its plural forms
# (one/other in English), a plain message needs only other. Placeholders are
# named — {{.Name}} survives word-order changes, unlike %s.
#
# The set of keys and placeholders must match ru.toml; a test enforces that.

