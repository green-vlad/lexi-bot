# Прод: бот и база на одной машине, наружу не открыто ничего.
#
# Файл живёт на сервере в /opt/lexi-bot рядом с .env (права 600) и приезжает
# туда не деплоем, а руками: смена образа происходит каждый релиз, а состав
# сервисов — раз в полгода, и лишний способ им управлять только добавил бы
# способов ошибиться.
#
# Локальная разработка описана отдельно в docker-compose.yml: там открытый
# порт базы, здесь его нет.
services:
  bot:
    # Тег по умолчанию — latest, но деплой ставит IMAGE_TAG=sha-<полный SHA>:
    # откат тогда сводится к правке одной строки в .env и `up -d`.
    image: ghcr.io/green-vlad/lexi-bot:${IMAGE_TAG:-latest}
    container_name: lexi-bot
    restart: unless-stopped
    # Переменные перечислены поимённо, а не отданы через env_file: в окружении
    # контейнера тогда оказывается ровно то, что бот читает, и пароль базы
    # не лежит там вторым экземпляром рядом со строкой подключения.
    # Значения подставляются из .env — compose читает его сам.
    environment:
      APP_ENV: prod
      BOT_TOKEN: ${BOT_TOKEN:?токен бота не задан}
      # Пусто — тревоги выключены; это допустимо, поэтому без проверки.
      ADMIN_CHAT_ID: ${ADMIN_CHAT_ID:-}
      # Строка подключения собирается здесь, а не в .env: пароль в ней тот же
      # самый, что у Postgres, и держать его в двух местах — способ однажды
      # поменять его в одном.
      DATABASE_URL: postgres://lexi:${POSTGRES_PASSWORD:?пароль базы не задан}@postgres:5432/lexi?sslmode=disable
      # Внутри контейнера свой loopback, и петлевой адрес по умолчанию означал
      # бы «недоступен вообще». Наружу порт открывает публикация ниже.
      HTTP_ADDR: 0.0.0.0:8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
    ports:
      # Только на петлевой интерфейс хоста: /healthz дёргает деплой после
      # выката, /metrics — тот, кто зашёл по SSH. Снаружи их не видно.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        # Бот накатывает миграции при старте, то есть база нужна ему живой
        # с первой секунды. Без этого условия после перезагрузки сервера бот
        # стартует быстрее базы и уходит в цикл перезапусков.
        condition: service_healthy
    networks: [lexi]

  postgres:
    image: postgres:16-alpine
    container_name: lexi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lexi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?пароль базы не задан}
      POSTGRES_DB: lexi
    volumes:
      # Именованный том: данные переживают и замену образа, и docker compose
      # down. Убивает их только `down -v` — в проде эта команда не выполняется
      # никогда.
      - pgdata:/var/lib/postgresql/data
    # Порт наружу не публикуется вообще — ни на 0.0.0.0, ни на 127.0.0.1.
    # Бот ходит в базу по внутренней сети Docker, по имени сервиса. Получается
    # второй рубеж после ufw: даже при открытом файрволе снаружи некуда стучать.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexi -d lexi"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Первый запуск создаёт кластер, и до его готовности проверки должны
      # не считаться провалами, иначе бот не дождётся своей очереди.
      start_period: 30s
    networks: [lexi]

# Своя сеть, а не default: имя предсказуемо и не зависит от имени каталога,
# в котором лежит compose-файл.
networks:
  lexi:
    name: lexi

volumes:
  pgdata:
    name: lexi-pgdata
