name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINT_VERSION: v2.12.2
  # Бюджет размера образа из T-050. Держится distroless-базой и статической
  # сборкой; гейт ниже не даёт ему тихо расползтись.
  IMAGE_MAX_BYTES: 30000000

jobs:
  lint:
    name: Линтеры
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - name: Форматирование
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано (запустите task fmt):"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod в актуальном состоянии
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Собственный action используется вместо `task lint`: он кеширует
      # и бинарник линтера, и результаты анализа.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.LINT_VERSION }}

  test:
    name: Тесты
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lexi
          POSTGRES_PASSWORD: lexi
          POSTGRES_DB: lexi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://lexi:lexi@localhost:5432/lexi_test?sslmode=disable
      DATABASE_URL: postgres://lexi:lexi@localhost:5432/lexi_test?sslmode=disable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Taskfile читает .env; в CI значения приходят из окружения job'а,
      # поэтому файл нужен пустой — иначе значения из него перекроют нужные.
      - name: Пустой .env для task
        run: touch .env

      - name: Юнит-тесты
        run: task test:cover

      - name: Интеграционные тесты
        run: task test:integration

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  vuln:
    name: Уязвимости
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - run: go tool govulncheck ./...

  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Версия берётся из go.mod вместе с директивой toolchain: одна точка
          # правды для CI, локальной разработки и образа.
          go-version-file: go.mod
          cache: true

      - run: go build -trimpath -ldflags="-s -w" -o bin/lexi-bot ./cmd/bot

  image:
    name: Образ
    # Собирается на каждом PR, публикуется только с main: в реестре не должно
    # оказаться тега от ветки с красными тестами, но и узнавать о сломанном
    # Dockerfile уже после мержа не хочется.
    needs: [lint, test, vuln, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Логин нужен только для публикации; на PR шаг пропускается.
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # sha-<полный SHA> — то, чем откатывается релиз: тег однозначно
          # указывает на коммит. latest нужен только compose-файлу на VPS.
          tags: |
            type=sha,format=long
            type=raw,value=latest

      # Сборка в локальный демон, без публикации: образ нужно взвесить до того,
      # как он уедет в реестр. Второй вызов ниже целиком попадает в кеш.
      - name: Сборка
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Размер образа
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          size=$(docker image inspect "$IMAGE" --format '{{.Size}}')
          echo "размер образа: $size байт, предел $IMAGE_MAX_BYTES"
          if [ "$size" -gt "$IMAGE_MAX_BYTES" ]; then
            echo "образ вырос за бюджет: distroless и статическая сборка перестали окупаться" >&2
            exit 1
          fi

      - name: Публикация в GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
